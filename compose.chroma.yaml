# Unit 2, Part 2: a local, isolated Chroma server with persistent data.
name: rag-course

services:
  chroma:
    image: chromadb/chroma:1.5.9
    pull_policy: missing
    ports:
      - "127.0.0.1:${CHROMA_PORT:-8004}:8000"
    volumes:
      - chroma_data:/data
    healthcheck:
      # This Rust image has Bash but no curl/Python. Check an actual HTTP 200.
      test:
        - CMD
        - bash
        - -ec
        - |
          exec 3<>/dev/tcp/127.0.0.1/8000
          printf 'GET /api/v2/heartbeat HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3
          read -r status <&3
          [[ "$$status" == *" 200 "* ]]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  chroma_data:
