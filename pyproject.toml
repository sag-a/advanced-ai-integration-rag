[project]
name = "magenta-rag-course"
version = "0.1.0"
description = "Advanced RAG course: embedding and vector-database modules, a shared RAG core and inspectable architectures"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "langgraph==1.2.14",
    "langchain-anthropic==1.7.5",
    "langchain-core==1.6.9",
    "chromadb==1.5.9",
    "pypdf==6.20.0",
    "transformers==5.19.0",
    "torch==2.14.1",
    "pydantic==2.14.0",
    "rich==15.0.0",
    "jinja2==3.1.6",
    "python-dotenv>=1.0,<2",
    "filelock==3.32.7",
    "streamlit==1.65.0",
    "httpx==0.28.1",
    "numpy==2.5.3",
    "einops==0.8.2",
    "safetensors==0.8.0",
    "huggingface-hub==1.33.0",
]

[project.optional-dependencies]
graph = ["graphviz>=0.19,<1", "networkx>=3,<4", "python-louvain==0.16"]
agentic = ["deepagents==0.7.19"]
hybrid = ["scikit-learn>=1.5,<2"]
# Modules c01-c02: chunking comparison, TF-IDF baseline and plots; pgvector demo.
chapters = ["scikit-learn>=1.5,<2", "langchain-text-splitters>=1,<2", "matplotlib>=3.8,<4"]
pgvector = ["psycopg[binary]>=3.2,<4", "pgvector>=0.4,<1"]
dev = ["pytest>=9,<10", "ruff>=0.14,<1"]
eval = [
    "langchain-community==0.4.1",
    "ragas==0.4.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rag_core", "architectures", "app", "evals", "modules"]

[tool.hatch.build.targets.sdist]
exclude = [".env", ".env.*", "outputs", ".venv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Ragas 0.4 marks evaluate() and LangchainLLMWrapper deprecated; both work in the pinned 0.4.3.
filterwarnings = ["ignore::DeprecationWarning:ragas.*", "ignore:LangchainLLMWrapper is deprecated"]

[tool.ruff]
target-version = "py311"
line-length = 96

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.uv]
package = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
